name: Set up the toolchain
description: Install the repository's pinned Bun and Node versions and the workspace dependencies.

# The single place for toolchain versions. Keep other workflows free of them.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.11
    - uses: actions/setup-node@v4
      with:
        node-version: 24.18.0
    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-install-${{ runner.os }}-${{ runner.arch }}-
    - run: bun install --frozen-lockfile
      shell: bash
