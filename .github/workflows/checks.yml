name: Checks

# The job bodies live here so another repository can call the same jobs.
# Callers own the triggers, permissions and concurrency.
on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The whole-repository typecheck exceeds the runner's default heap.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Format check, lint, typecheck and the e2e boundary check
        run: bun run check

  e2e-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/e2e-tools
      - run: bun run e2e:prepare
      - name: Run the local target
        run: xvfb-run -a bun run e2e:local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-local-evidence
          retention-days: 7
          path: |
            .local/e2e
            !.local/e2e/**/actors.json

  e2e-self-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/e2e-tools
      - run: bun run e2e:prepare
      # The Claude Code MCP scenario needs a model API key. CI holds no secrets,
      # so this run excludes it. Run it locally with E2E_CLAUDE_BASE_URL and
      # E2E_CLAUDE_API_KEY.
      - name: Run the self-host target
        run: xvfb-run -a bun run e2e:self-host --test-name '^(?!.*Claude Code connects)'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-self-host-evidence
          retention-days: 7
          path: |
            .local/e2e
            !.local/e2e/**/actors.json

  e2e-cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/e2e-tools
      # A local Cloud Worker, a throwaway Postgres container and service
      # emulators. This target needs Docker and no credentials. It does not
      # inherit DISPLAY, and its browsers are headless, so it needs no Xvfb.
      - name: Run the Cloud onboarding scenarios
        run: bun run e2e:cloud --test-name 'Cloud onboarding'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-cloud-evidence
          retention-days: 7
          path: |
            .local/e2e
            !.local/e2e/**/actors.json
